<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>BlockyAnimal! Asg2!~</title>
</head>

<a href="https://aminisofia.github.io/CSE160/" target="_blank">
  <button><- Back</button>
</a>
<br><br>


  <body onload="main()">

    <canvas id="webgl" width="400" height="400" style="border: 2px dashed #1d2f64; border-radius: 30px;">
      Please use a browser that supports "canvas"
    </canvas>

    <script src="../lib/webgl-utils.js"></script>
    <script src="../lib/webgl-debug.js"></script>
    <script src="../lib/cuon-utils.js"></script>
    <script src="../lib/cuon-matrix.js"></script>
    <script src="BlockyAnimal.js"></script>
    <script src="Cube.js"></script>
    <script src="tiger.js"></script>

    <i><p id="fps" style="margin-top: 0px;"></p></i>

    <label for="angleSlide">Camera Angle:</label>
    <input type="range" min="-90" max="90" value="60" class="slider" id="angleSlide"/>
    <br> <br>

    <label><b>Joints</b></label>
    <br>
    <label>Upper:</label>
    <input type="range" id="legUpper" min="-20" max="20" value="0" step="0.2"/>
    <label>Lower:</label>
    <input type="range" id="legLower" min="-20" max="20" value="0" step="0.2"/>
    <br>
    <br>

    <label><b>Animate!</b></label>
    <br>
    <button id="animationOn">On</button>
    <button id="animationOff">Off</button>
    <br>

  </body>
</html>
